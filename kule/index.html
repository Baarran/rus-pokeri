<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Buz Kule — Zıpla ve Tırman</title>
<style>
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; }
html, body { margin:0; height:100%; overflow:hidden; background:#07111f; color:#fff; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; touch-action:none; overscroll-behavior:none; }
canvas { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); display:block; }
[hidden] { display:none !important; }
.btn { background:#26324d; color:#fff; border:1px solid #3a4870; border-radius:14px; padding:13px 18px; font-size:17px; font-weight:800; text-decoration:none; display:inline-block; }
.btn.pri { background:linear-gradient(#5bc8ff,#1f86d6); border-color:#8fdcff; }
#ov { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; padding:16px; background:rgba(5,12,24,.78); z-index:20; overflow:auto; }
.card { background:#13233d; border:1px solid #2f4a78; border-radius:18px; padding:16px; width:100%; max-width:380px; text-align:center; }
h1 { margin:0; letter-spacing:.08em; font-size:30px; } .sub { color:#9db4d8; font-size:13px; margin:4px 0 12px; }
.big { font-size:44px; font-weight:900; color:#9fe3ff; } 
#lb { text-align:left; margin:10px 0; font-size:14px; } #lb div { display:flex; justify-content:space-between; padding:5px 8px; border-radius:8px; } #lb div:nth-child(odd) { background:#182c4b; } #lb .me { outline:1px solid #5bc8ff; }
.help { color:#9db4d8; font-size:12.5px; line-height:1.5; margin-top:10px; }
#pad { position:fixed; left:0; right:0; bottom:0; height:30%; max-height:190px; display:flex; gap:10px; padding:10px 12px calc(10px + env(safe-area-inset-bottom)); z-index:10; pointer-events:none; }
#pad button { pointer-events:auto; flex:1; border-radius:18px; border:1px solid rgba(255,255,255,.35); background:rgba(40,80,130,.45); color:#fff; font-size:34px; font-weight:900; }
#pad button.on { background:rgba(91,200,255,.55); } #pad #bJ { flex:1.4; }
#back { position:fixed; left:8px; top:8px; z-index:30; padding:7px 12px; font-size:14px; }
.sec { margin:12px 0 4px; font-weight:800; color:#9fd8f5; font-size:13px; letter-spacing:.06em; text-transform:uppercase; }
.mode { display:block; width:100%; text-align:left; background:#1c2e52; color:#fff; border:1px solid #2f4a78; border-radius:12px; padding:10px 12px; margin:6px 0; } .mode b { display:block; font-size:16px; } .mode small { color:#9db4d8; font-size:12px; } .mode.on { border-color:#5bc8ff; background:#23407a; }
.room { display:flex; justify-content:space-between; align-items:center; gap:8px; background:#182c4b; border-radius:12px; padding:10px; margin:6px 0; text-align:left; } .room small { display:block; color:#9db4d8; }
.lr { display:flex; align-items:center; gap:10px; padding:7px 10px; border-radius:10px; background:#182c4b; margin:5px 0; font-size:15px; text-align:left; } .lr i { width:14px; height:14px; border-radius:50%; background:#2a3463; } .lr span { flex:1; } .lr.emp { opacity:.4; } .lr b.ok { color:#6dffa0; } .lr b.wt { color:#ffb86d; }
.btn[disabled] { opacity:.45; }
</style>
</head>
<body>
<a class="btn" id="back" href="../">‹ Ana lobi</a>
<canvas id="c"></canvas>
<div id="pad" hidden><button id="bL">◀</button><button id="bR">▶</button><button id="bJ">⤒</button></div>
<div id="ov"><div class="card" id="card"></div></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="game.js"></script>
</body>
</html>
