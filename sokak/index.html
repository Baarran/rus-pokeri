<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Sokak Futbolu — 1v1 / 2v2</title>
<style>
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; }
html, body { margin:0; height:100%; overflow:hidden; background:#06130c; color:#fff; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; touch-action:none; overscroll-behavior:none; }
canvas { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); display:block; }
[hidden] { display:none !important; }
.btn { background:#26324d; color:#fff; border:1px solid #3a4870; border-radius:12px; padding:12px 16px; font-size:16px; font-weight:800; text-decoration:none; display:inline-block; }
.btn.pri { background:linear-gradient(#3fd16f,#1a8f45); border-color:#8bf0ae; } .btn[disabled] { opacity:.45; } .btn:active { transform:scale(.97); }
#ov { position:fixed; inset:0; background:radial-gradient(120% 80% at 50% 0%, #135a2c, #06130c); display:flex; align-items:center; justify-content:center; padding:14px; z-index:40; overflow:auto; }
.card { background:#10261a; border:1px solid #2c6a43; border-radius:16px; padding:14px; width:100%; max-width:460px; }
h1 { margin:0 0 4px; text-align:center; letter-spacing:.08em; font-size:26px; color:#9bffbd; } .sub { color:#9fc7ae; text-align:center; font-size:13px; margin:0 0 10px; }
.help { color:#9fc7ae; font-size:12.5px; line-height:1.5; margin-top:8px; }
.mode { display:block; width:100%; text-align:left; background:#16382a; color:#fff; border:1px solid #2c6a43; border-radius:12px; padding:10px 12px; margin:6px 0; } .mode b { display:block; font-size:16px; } .mode small { color:#9fc7ae; font-size:12px; } .mode.on { border-color:#8bf0ae; background:#1d5a3a; }
.sec { margin:12px 0 4px; font-weight:800; color:#8bf0ae; font-size:12.5px; letter-spacing:.06em; text-transform:uppercase; }
.room { display:flex; justify-content:space-between; align-items:center; gap:8px; background:#16382a; border-radius:12px; padding:10px; margin:6px 0; } .room small { display:block; color:#9fc7ae; }
.teams { display:flex; gap:8px; } .team { flex:1; background:#16382a; border-radius:12px; padding:8px; min-height:120px; } .team h4 { margin:0 0 6px; font-size:14px; } .team.t0 h4 { color:#ff7a7a; } .team.t1 h4 { color:#7ab8ff; }
.pr { display:flex; justify-content:space-between; align-items:center; gap:6px; padding:6px 8px; border-radius:8px; background:#1d4a33; margin:4px 0; font-size:14px; } .pr.emp { opacity:.4; } .ok { color:#6dffa0; } .wt { color:#ffb86d; }
.lopt { display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between; margin-top:10px; font-size:14px; } select { background:#16382a; color:#fff; border:1px solid #2c6a43; border-radius:8px; padding:6px; }
#hud { position:fixed; inset:0; z-index:10; pointer-events:none; }
#bar { position:absolute; left:50%; bottom:calc(10px + env(safe-area-inset-bottom)); transform:translateX(-50%); width:160px; height:10px; background:rgba(0,0,0,.45); border-radius:6px; overflow:hidden; display:none; } #bar i { display:block; height:100%; width:0; background:#ffd34d; }
#stam { position:absolute; left:14px; top:60px; width:70px; height:6px; background:rgba(0,0,0,.4); border-radius:4px; overflow:hidden; } #stam i { display:block; height:100%; width:100%; background:#5ad2ff; }
#joyZone { position:fixed; left:0; top:0; width:50%; bottom:0; z-index:12; touch-action:none; }
#joy { position:fixed; left:34px; bottom:calc(34px + env(safe-area-inset-bottom)); width:130px; height:130px; border-radius:50%; background:rgba(255,255,255,.08); border:2px solid rgba(255,255,255,.25); z-index:12; pointer-events:none; opacity:.55; } #joy.act { opacity:1; }
#joy i { position:absolute; left:41px; top:41px; width:48px; height:48px; border-radius:50%; background:rgba(255,255,255,.4); }
.tb { position:fixed; z-index:13; border-radius:50%; border:2px solid rgba(255,255,255,.4); background:rgba(255,255,255,.16); color:#fff; font-weight:900; display:flex; align-items:center; justify-content:center; touch-action:none; text-align:center; } .tb.on { background:rgba(255,255,255,.42); transform:scale(.94); }
#bShoot { right:26px; bottom:calc(46px + env(safe-area-inset-bottom)); width:96px; height:96px; background:rgba(255,90,60,.45); font-size:16px; }
#bPass { right:136px; bottom:calc(36px + env(safe-area-inset-bottom)); width:72px; height:72px; background:rgba(80,160,255,.4); font-size:14px; }
#bSprint { right:44px; bottom:calc(158px + env(safe-area-inset-bottom)); width:66px; height:66px; background:rgba(255,210,70,.35); font-size:13px; }
@media (max-height:430px) { #bShoot { width:80px; height:80px; bottom:calc(26px + env(safe-area-inset-bottom)); } #bPass { right:116px; bottom:calc(22px + env(safe-area-inset-bottom)); width:60px; height:60px; } #bSprint { bottom:calc(112px + env(safe-area-inset-bottom)); right:36px; width:56px; height:56px; } #joy { bottom:calc(14px + env(safe-area-inset-bottom)); } }
#back { position:fixed; left:8px; top:8px; z-index:30; padding:6px 10px; font-size:13px; }
#rot { position:fixed; inset:0; z-index:60; background:#06130c; display:none; align-items:center; justify-content:center; text-align:center; font-size:20px; padding:30px; } @media (orientation:portrait) { body.playing #rot { display:flex; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<a class="btn" id="back" href="../">‹ Ana lobi</a>
<div id="hud" hidden><div id="stam"><i></i></div><div id="bar"><i></i></div></div>
<div id="joyZone" hidden></div><div id="joy" hidden><i></i></div>
<div class="tb" id="bShoot" hidden>ŞUT<br>(basılı tut)</div><div class="tb" id="bPass" hidden>PAS</div><div class="tb" id="bSprint" hidden>KOŞ</div>
<div id="ov"><div class="card" id="card"></div></div>
<div id="rot">📱↻<br><br>Telefonu yan çevir</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="game.js"></script>
</body>
</html>
