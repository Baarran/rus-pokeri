<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Altın Ayak — Futbolcu Kariyeri</title>
<style>
:root{--bg:#0b1020;--card:#151d38;--card2:#1c2748;--ac:#c6ff3d;--ac2:#ff7a3d;--tx:#eef2ff;--mu:#93a0c8;--ok:#4ade80;--bad:#ff5d6c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
body{background:radial-gradient(120% 60% at 50% -10%,#1d2f66,#0b1020 60%)}
#app{max-width:480px;margin:0 auto;min-height:100%;padding:12px 12px calc(84px + env(safe-area-inset-bottom))}
h1{margin:6px 0 2px;font-size:28px;letter-spacing:.04em;text-align:center;color:var(--ac)} h2{margin:14px 0 8px;font-size:15px;color:var(--ac);letter-spacing:.06em;text-transform:uppercase}
.sub{color:var(--mu);text-align:center;font-size:13px;margin:0 0 14px}
.card{background:var(--card);border:1px solid #26335f;border-radius:16px;padding:12px;margin:10px 0}
.btn{display:block;width:100%;background:var(--card2);color:var(--tx);border:1px solid #33437c;border-radius:14px;padding:14px;font-size:16px;font-weight:800;text-align:center;text-decoration:none}
.btn.pri{background:linear-gradient(#d7ff6b,#a5e51d);color:#13200a;border-color:#e6ffa0}.btn.hot{background:linear-gradient(#ff9a5c,#f0561a);border-color:#ffc09a}.btn:active{transform:scale(.98)}.btn[disabled]{opacity:.4}
.btn.sm{display:inline-block;width:auto;padding:8px 12px;font-size:14px;border-radius:10px}
input[type=text]{width:100%;background:#0e1530;color:var(--tx);border:1px solid #33437c;border-radius:12px;padding:14px;font-size:17px;margin:6px 0;-webkit-user-select:text;user-select:text}
.row{display:flex;align-items:center;gap:8px}.sp{flex:1}.mu{color:var(--mu);font-size:12.5px}.gold{color:#ffd54a}
.bar{height:9px;background:#0b1230;border-radius:6px;overflow:hidden;margin-top:3px}.bar i{display:block;height:100%;border-radius:6px}
.stat{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #202c55}.stat:last-child{border:0}.stat b{width:84px}.stat .bar{flex:1;margin:0}.stat span{width:28px;text-align:right;font-weight:800}
.av{width:62px;height:62px;border-radius:50%;background:linear-gradient(135deg,var(--ac),#2aa9ff);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:900;color:#0b1020;flex:none;border:3px solid #fff2}
.pos{display:flex;gap:8px}.pos .btn{padding:12px 4px;font-size:14px}.pos .on{border-color:var(--ac);background:#27407a}
.pill{display:inline-block;background:#0f1a3d;border:1px solid #2c3b72;border-radius:20px;padding:3px 10px;font-size:12px;margin:2px}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px 4px;text-align:left;border-bottom:1px solid #202c55}th{color:var(--mu);font-weight:600}tr.me td{color:var(--ac);font-weight:800}
nav{position:fixed;left:0;right:0;bottom:0;background:#0d1431;border-top:1px solid #26335f;display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:20;max-width:480px;margin:0 auto}
nav button{flex:1;background:none;border:0;color:var(--mu);font-size:11px;padding:6px 0;font-weight:700}nav button b{display:block;font-size:20px}nav button.on{color:var(--ac)}
canvas{width:100%;display:block;border-radius:16px;background:#0e5a2a;touch-action:none}
.res{text-align:center;font-size:20px;font-weight:900;margin:10px 0}
.tabs{display:flex;gap:6px;margin:8px 0}.tabs button{flex:1;padding:10px 2px;border-radius:10px;border:1px solid #33437c;background:var(--card2);color:var(--tx);font-weight:700;font-size:13px}.tabs .on{background:#2c4a9a;border-color:var(--ac)}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:#1d2b5e;border:1px solid var(--ac);padding:10px 16px;border-radius:12px;z-index:50;font-weight:700}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="game.js"></script>
</body>
</html>
